    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteHmrShim(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            if (isViteHmr) {
              const listeners = new Map();
              const shim = {
                url: url,
                protocols: protocols,
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(event, cb) {
                  if (!listeners.has(event)) listeners.set(event, []);
                  listeners.get(event).push(cb);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { cb(new Event('open')); } catch (_) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, cb) {
                  const list = listeners.get(event);
                  if (list) {
                    const idx = list.indexOf(cb);
                    if (idx !== -1) list.splice(idx, 1);
                  }
                },
                dispatchEvent: function(event) {
                  const list = listeners.get(event.type);
                  if (list) list.forEach(function(cb) { try { cb(event); } catch (_) {} });
                  return true;
                }
              };
              return shim;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteHmrShim.prototype = NativeWebSocket.prototype;
          ViteHmrShim.CONNECTING = NativeWebSocket.CONNECTING;
          ViteHmrShim.OPEN = NativeWebSocket.OPEN;
          ViteHmrShim.CLOSING = NativeWebSocket.CLOSING;
          ViteHmrShim.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteHmrShim;

          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket closed without opened')) {
              event.preventDefault();
            }
          });
        }
      })();
    </script>
