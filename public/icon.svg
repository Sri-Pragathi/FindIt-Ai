<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183C32"/>
      <stop offset="100%" stop-color="#0f2620"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C975"/>
      <stop offset="100%" stop-color="#D6A354"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#grad)"/>

  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#D6A354" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Compass / Shield Ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#A8B7A0" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 8"/>

  <!-- Central Search & Pin Motif -->
  <g filter="url(#shadow)">
    <!-- Campus Building / Bookmark Shape -->
    <path d="M256 120 C 190 120 140 170 140 236 C 140 310 236 388 256 404 C 276 388 372 310 372 236 C 372 170 322 120 256 120 Z" fill="#183C32" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Inner Lens -->
    <circle cx="256" cy="232" r="64" fill="#F8F6F0" fill-opacity="0.95"/>

    <!-- AI Sparkle / Star in Center -->
    <path d="M256 194 Q 256 232 294 232 Q 256 232 256 270 Q 256 232 218 232 Q 256 232 256 194 Z" fill="#D6A354"/>
    <circle cx="256" cy="232" r="7" fill="#183C32"/>
  </g>

  <!-- Small AI Accent Stars -->
  <path d="M380 150 Q 380 166 396 166 Q 380 166 380 182 Q 380 166 364 166 Q 380 166 380 150 Z" fill="#F2C975"/>
  <path d="M136 290 Q 136 302 148 302 Q 136 302 136 314 Q 136 302 124 302 Q 136 302 136 290 Z" fill="#A8B7A0"/>

  <!-- Brand Typography Arc or Subtle Base Pill -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#F8F6F0" letter-spacing="4" text-anchor="middle">FindItAi</text>
</svg>
